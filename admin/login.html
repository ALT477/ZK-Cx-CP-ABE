<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IoToDChain Admin — Login</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <h1>IoToDChain Admin</h1>
    <p class="subtitle">Hospitals, departments, specialities, providers, patients &amp; attributes</p>

    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
    </div>

    <button class="btn btn-primary" id="btnLogin">Log in</button>
    <p class="error-text" id="errorText"></p>
  </div>
</div>

<script>
const API_BASE = window.location.origin + window.location.pathname.split("/admin")[0];

async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const errorText = document.getElementById("errorText");
  errorText.textContent = "";

  if (!username || !password) {
    errorText.textContent = "Enter a username and password.";
    return;
  }

  try {
    const response = await fetch(`${API_BASE}/api/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await response.json();
    if (!response.ok) {
      errorText.textContent = data.detail || "Login failed.";
      return;
    }
    localStorage.setItem("admin_token", data.token);
    localStorage.setItem("admin_username", data.username);
    window.location.href = "index.html";
  } catch (e) {
    errorText.textContent = "Could not reach the server.";
  }
}

document.getElementById("btnLogin").addEventListener("click", login);
document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
