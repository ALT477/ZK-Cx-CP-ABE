# Insert this location block inside the EXISTING server { ... } block
# for incub.univ-msila.dz (the one that already handles HTTPS/SSL for
# the root domain). Do not create a brand new server block for this —
# it would conflict with whatever already serves the domain root.

location /iotodchain/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /iotodchain;
}
